name: Review live check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Run the storefront review check
        env:
          STORE_URL: https://aurelle-jewelry-zeta.vercel.app
          ADMIN_EMAIL: ${{ secrets.REVIEW_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.REVIEW_ADMIN_PASSWORD }}
        run: node scripts/review-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-live-check
          path: review-live-check/
          if-no-files-found: ignore
